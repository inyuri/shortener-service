databaseChangeLog:
  - changeSet:
      id: 002-create-outbox-table
      author: timofey
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: outbox_events

      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: aggregate_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: sent_at
                  type: TIMESTAMP
                  constraints:
                    nullable: true

        - sql:
            sql: >-
              ALTER TABLE outbox_events ADD CONSTRAINT chk_outbox_events_status
              CHECK (status IN ('PENDING', 'SENT', 'FAILED'))
